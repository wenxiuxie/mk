<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学逻辑大冒险 - 3-4年级互动练习</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Microsoft YaHei, sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #333; }
    .game-container { background: #ffffff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 800px; overflow: hidden; display: flex; flex-direction: column; }
    .header { background: linear-gradient(45deg, #FF6B6B, #FF8E53); color: white; padding: 20px 30px; text-align: center; }
    .header h1 { font-size: 26px; margin-bottom: 5px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .nav-tabs { display: flex; background: #f1f3f5; border-bottom: 2px solid #e9ecef; }
    .tab-btn { flex: 1; padding: 15px 10px; border: none; background: none; font-size: 16px; font-weight: bold; color: #495057; cursor: pointer; transition: all 0.3s ease; }
    .tab-btn:hover { background: #e9ecef; color: #228be6; }
    .tab-btn.active { background: #fff; color: #FF6B6B; border-bottom: 3px solid #FF6B6B; }
    .game-panel { padding: 30px; display: none; }
    .game-panel.active { display: block; }
    
    /* 通用组件 */
    .stats-bar { display: flex; justify-content: space-around; background: #f8f9fa; padding: 12px; border-radius: 12px; margin-bottom: 25px; font-weight: bold; color: #495057; }
    .stat-value { color: #FF6B6B; font-size: 20px; }
    .btn { background: linear-gradient(45deg, #FF6B6B, #FF8E53); color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,107,107,0.3); transition: transform 0.1s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-secondary { background: #6c757d; box-shadow: 0 4px 10px rgba(108,117,125,0.3); }

    /* 游戏1: 乘法网格 */
    .grid-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 400px; margin: 0 auto 20px; }
    .grid-cell { aspect-ratio: 1; background: #f1f3f5; border: 2px solid #dee2e6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #343a40; cursor: pointer; transition: all 0.2s; }
    .grid-cell:hover { background: #e7f5ff; border-color: #74c0fc; }
    .grid-cell.solved { background: #d3f9d8; border-color: #40c057; color: #2b8a3e; }

    /* 游戏2: 24点卡片 */
    .cards-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
    .card { width: 70px; height: 100px; background: white; border: 3px solid #333; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: bold; box-shadow: 0 5px 10px rgba(0,0,0,0.1); color: #2b8a3e; }
    .input-box { width: 100%; max-width: 350px; padding: 12px; font-size: 20px; border: 2px solid #ced4da; border-radius: 10px; text-align: center; margin: 0 auto 15px; display: block; outline: none; }

    /* 游戏3: 分数 */
    .fraction-comparison { display: flex; align-items: center; justify-content: center; gap: 30px; margin-bottom: 30px; }
    .fraction-box { background: #fff0f6; border: 2px dashed #ff8787; border-radius: 15px; padding: 15px 25px; text-align: center; }
    .fraction { display: inline-flex; flex-direction: column; align-items: center; font-size: 26px; font-weight: bold; color: #c92a2a; }
    .fraction .numerator { border-bottom: 3px solid #c92a2a; padding: 0 8px 2px; }
    .comp-btns { display: flex; justify-content: center; gap: 15px; }
    .comp-btn { width: 55px; height: 55px; border-radius: 50%; font-size: 24px; font-weight: bold; border: 2px solid #dee2e6; background: white; cursor: pointer; }
    .comp-btn:hover { background: #e7f5ff; border-color: #4c6ef5; color: #4c6ef5; }

    .feedback { text-align: center; font-size: 18px; font-weight: bold; margin-top: 15px; min-height: 27px; }
    .feedback.correct { color: #40c057; }
    .feedback.wrong { color: #fa5252; }
    .instructions { background: #e7f5ff; border-left: 4px solid #339af0; padding: 10px 15px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 14px; color: #1864ab; }
</style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>数学逻辑大冒险 </h1>
        <p>适合 3-4 年级的趣味互动练习册</p>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab(0)">九九九速算格子</button>
        <button class="tab-btn" onclick="switchTab(1)">巧算 24 点</button>
        <button class="tab-btn" onclick="switchTab(2)">分数大比拼</button>
    </div>

    <!-- 游戏 1: 乘法连连看 -->
    <div class="game-panel active" id="panel-0">
        <div class="instructions"><strong>玩法：</strong>根据提示的乘法算式，在格子中点击正确的答案！</div>
        <div class="stats-bar">
            <div>题目: <span class="stat-value" id="mult-question">? × ?</span></div>
            <div>得分: <span class="stat-value" id="score-1">0</span></div>
        </div>
        <div class="grid-board" id="bingo-grid"></div>
        <div class="feedback" id="feedback-1"></div>
    </div>

    <!-- 游戏 2: 24点 -->
    <div class="game-panel" id="panel-1">
        <div class="instructions"><strong>玩法：</strong>用给出的 4 个数字，凑出结果等于 24 的算式（可用 + - * / 和括号）。</div>
        <div class="stats-bar">
            <div>得分: <span class="stat-value" id="score-2">0</span></div>
        </div>
        <div class="cards-container" id="cards-container"></div>
        <input type="text" class="input-box" id="calc-input" placeholder="例如: (3+5)*6/2">
        <div style="text-align: center; gap: 10px; display: flex; justify-content: center;">
            <button class="btn" onclick="check24()">提交答案</button>
            <button class="btn btn-secondary" onclick="generate24Cards()">换一组</button>
        </div>
        <div class="feedback" id="feedback-2"></div>
    </div>

    <!-- 游戏 3: 分数比较 -->
    <div class="game-panel" id="panel-2">
        <div class="instructions"><strong>玩法：</strong>比较左右两个分数的大小，点击正确的符号！</div>
        <div class="stats-bar">
            <div>得分: <span class="stat-value" id="score-3">0</span></div>
        </div>
        <div class="fraction-comparison">
            <div class="fraction-box">
                <div class="fraction">
                    <span class="numerator" id="f1-num">1</span>
                    <span id="f1-den">4</span>
                </div>
            </div>
            <div style="font-size: 30px; font-weight: bold; color: #adb5bd;" id="comp-symbol">?</div>
            <div class="fraction-box">
                <div class="fraction">
                    <span class="numerator" id="f2-num">2</span>
                    <span id="f2-den">3</span>
                </div>
            </div>
        </div>
        <div class="comp-btns">
            <button class="comp-btn" onclick="checkFraction('>')">&gt;</button>
            <button class="comp-btn" onclick="checkFraction('=')">=</button>
            <button class="comp-btn" onclick="checkFraction('<')">&lt;</button>
        </div>
        <div class="feedback" id="feedback-3"></div>
    </div>
</div>

<script>
    function switchTab(index) {
        document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
        document.querySelectorAll('.game-panel').forEach((panel, i) => panel.classList.toggle('active', i === index));
    }

    // --- 游戏 1 逻辑 ---
    let score1 = 0, currentF1 = 0, currentF2 = 0, gridNumbers = [];
    function initGame1() {
        const grid = document.getElementById('bingo-grid');
        grid.innerHTML = ''; gridNumbers = [];
        for (let i = 0; i < 25; i++) {
            let num;
            do { num = (Math.floor(Math.random() * 9) + 1) * (Math.floor(Math.random() * 9) + 1); } 
            while (gridNumbers.includes(num));
            gridNumbers.push(num);
        }
        gridNumbers.forEach(val => {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.innerText = val;
            cell.onclick = () => {
                if (val === currentF1 * currentF2) {
                    score1 += 10;
                    document.getElementById('score-1').innerText = score1;
                    document.getElementById('feedback-1').className = 'feedback correct';
                    document.getElementById('feedback-1').innerText = '🎯 答对了！';
                    cell.classList.add('solved');
                    setTimeout(nextGame1, 800);
                } else {
                    document.getElementById('feedback-1').className = 'feedback wrong';
                    document.getElementById('feedback-1').innerText = '❌ 再算算看！';
                }
            };
            grid.appendChild(cell);
        });
        nextGame1();
    }
    function nextGame1() {
        const target = gridNumbers[Math.floor(Math.random() * gridNumbers.length)];
        let factors = [];
        for(let i = 1; i <= 9; i++) { if(target % i === 0 && (target / i) <= 9) factors.push([i, target / i]); }
        const pair = factors[Math.floor(Math.random() * factors.length)];
        currentF1 = pair[0]; currentF2 = pair[1];
        document.getElementById('mult-question').innerText = `${currentF1} × ${currentF2}`;
        document.getElementById('feedback-1').innerText = '';
    }

    // --- 游戏 2 逻辑 ---
    let currentCards = [], score2 = 0;
    function generate24Cards() {
        currentCards = Array.from({length: 4}, () => Math.floor(Math.random() * 9) + 1);
        const container = document.getElementById('cards-container');
        container.innerHTML = '';
        currentCards.forEach(num => {
            const card = document.createElement('div');
            card.className = 'card'; card.innerText = num;
            container.appendChild(card);
        });
        document.getElementById('calc-input').value = '';
        document.getElementById('feedback-2').innerText = '';
    }
    function check24() {
        const input = document.getElementById('calc-input').value.trim();
        const fb = document.getElementById('feedback-2');
        const nums = input.match(/\d+/g);
        if (!nums || nums.length !== 4) { fb.className = 'feedback wrong'; fb.innerText = '⚠️ 必须且仅能使用给出的4个数字'; return; }
        if (!nums.map(Number).sort().every((v, i) => v === [...currentCards].sort()[i])) {
            fb.className = 'feedback wrong'; fb.innerText = '⚠️ 请只使用卡片上的数字！'; return;
        }
        try {
            if (/[^0-9\+\-\*\/\(\)\s]/.test(input)) throw new Error();
            if (Math.abs(eval(input) - 24) < 0.0001) {
                score2 += 20; document.getElementById('score-2').innerText = score2;
                fb.className = 'feedback correct'; fb.innerText = '🎉 厉害！计算正确！+20分';
                setTimeout(generate24Cards, 1200);
            } else { fb.className = 'feedback wrong'; fb.innerText = `❌ 结果是 ${eval(input)}，再试一次！`; }
        } catch (e) { fb.className = 'feedback wrong'; fb.innerText = '⚠️ 算式格式有误'; }
    }

    // --- 游戏 3 逻辑 ---
    let score3 = 0, f1 = {}, f2 = {};
    function generateFractions() {
        let d1 = Math.floor(Math.random() * 7) + 2, d2 = Math.floor(Math.random() * 7) + 2;
        let n1 = Math.floor(Math.random() * (d1 - 1)) + 1, n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
        f1 = { num: n1, den: d1 }; f2 = { num: n2, den: d2 };
        document.getElementById('f1-num').innerText = f1.num; document.getElementById('f1-den').innerText = f1.den;
        document.getElementById('f2-num').innerText = f2.num; document.getElementById('f2-den').innerText = f2.den;
        document.getElementById('comp-symbol').innerText = '?';
        document.getElementById('feedback-3').innerText = '';
    }
    function checkFraction(sym) {
        const v1 = f1.num / f1.den, v2 = f2.num / f2.den;
        let realSym = Math.abs(v1 - v2) < 0.0001 ? '=' : (v1 > v2 ? '>' : '<');
        document.getElementById('comp-symbol').innerText = sym;
        const fb = document.getElementById('feedback-3');
        if (sym === realSym) {
            score3 += 10; document.getElementById('score-3').innerText = score3;
            fb.className = 'feedback correct'; fb.innerText = '🌟 太棒了！回答正确！';
            setTimeout(generateFractions, 1000);
        } else { fb.className = 'feedback wrong'; fb.innerText = '❌ 答错了，试着通分想想看？'; }
    }

    initGame1(); generate24Cards(); generateFractions();
</script>
</body>
</html>
